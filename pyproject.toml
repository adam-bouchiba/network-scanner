[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-scanner"
version = "1.0.0"
description = "A fast multithreaded TCP network scanner written in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Adam Bouchiba" }
]

keywords = [
    "cybersecurity",
    "network-scanner",
    "port-scanner",
    "python",
    "tcp",
    "reconnaissance",
]

[project.scripts]
netscan = "netscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true