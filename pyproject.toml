[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-scanner"
version = "0.1.0"
description = "Python Network Scanner"
requires-python = ">=3.10"

[project.scripts]
netscan = "netscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]